<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tip Calculator App</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
		rel="stylesheet">
	<link rel="stylesheet" href="style.css">
</head>

<body>
	<header class="container" id="logo">
		<img src="svg-files/logo.svg" alt="Splitter">
	</header>
	<main class="container" id="main">
		<h1 class="visually-hidden">Tip Calculator</h1>
		<div class="row">
			<div class="col-xl-6" id="first-col">
				<div class="container" id="first-col-container">
					<div class="container" id="errorDiv">
						<label for="inputOne" class="form-label">Bill</label>
						<span class="lead" id="error" aria-live="polite">Can't be zero or less</span>
						<span class="lead" id="errorTwo" aria-live="polite">Can't be empty</span>
					</div>
					<div class="input-group" id="input1">
						<div class="input-group-text"><img src="svg-files/icon-dollar.svg" alt=""></div>
						<input type="number" class="form-control" placeholder="0" name="bill" id="inputOne"
							min="0" step="0.01" required>
					</div>
					<div class="container">
						<span class="lead" id="selectTip">Select Tip %</span>
						<div role="group" class="btn-group" id="buttons" aria-labelledby="selectTip">
							<div class="container div">
								<input type="radio" class="btn-check" name="options" id="option1" autocomplete="off">
								<label class="btn" for="option1" id="label-1">5%</label>
							</div>
							<div class="container div">
								<input type="radio" class="btn-check" name="options" id="option2" autocomplete="off">
								<label class="btn" for="option2" id="label-2">10%</label>
							</div>
							<div class="container div">
								<input type="radio" class="btn-check" name="options" id="option3" autocomplete="off">
								<label class="btn" for="option3" id="label-3">15%</label>
							</div>
							<div class="container div">
								<input type="radio" class="btn-check" name="options" id="option4" autocomplete="off">
								<label class="btn" for="option4" id="label-4">25%</label>
							</div>
							<div class="container div">
								<input type="radio" class="btn-check" name="options" id="option5" autocomplete="off">
								<label class="btn" for="option5" id="label-5">50%</label>
							</div>
							<div class="container div" id="inputTwoDiv">
								<input type="number" class="form-control" placeholder="Custom" id="inputTwo"
									aria-label="Custom tip percentage" min="0" step="any">
							</div>
						</div>
					</div>
					<div class="container" id="errorDivTwo">
						<label for="inputThree" class="form-label">Number of People</label>
						<span class="lead" id="errorThree" aria-live="polite">Can't be zero or less</span>
						<span class="lead" id="errorFour" aria-live="polite">Can't be empty</span>
					</div>
					<div class="input-group" id="input2">
						<div class="input-group-text"><img src="svg-files/icon-person.svg" alt=""></div>
						<input type="number" class="form-control" placeholder="0" name="num" id="inputThree"
							min="1" step="1" required>
					</div>
				</div>
			</div>
			<div class="col-xl-6" id="second-col">
				<div class="container" id="secondColSection">
					<div class="container" id="priceSection">
						<div class="container d-inline">
							<span class="lead d-block" id="tipAmount">Tip Amount</span>
							<span class="lead d-block" id="person">/ person</span>
						</div>
						<div class="container" id="priceFlex">
							<span class="lead" id="price">$0.00</span>
						</div>
					</div>
					<div class="container" id="priceSection2">
						<div class="container">
							<span class="lead d-block" id="total">Total</span>
							<span class="lead d-block" id="Person">/ person</span>
						</div>
						<div class="container" id="priceFlex2">
							<span class="lead" id="price2">$0.00</span>
						</div>
					</div>
					<div class="container" id="buttonSection">
						<button class="btn" type="button" id="reset">RESET</button>
					</div>
				</div>
			</div>
		</div>
	</main>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
		crossorigin="anonymous"></script>
	<script src="app.js"></script>
</body>

</html>
